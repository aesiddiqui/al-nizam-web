<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="al-Nizam — an operating layer between you and AI">
  <!-- Source SVG for the social share card. Rasterized to /og-image.png (1200x630).
       Uses Georgia serif (not the site's Spectral web font) so headless rasterization
       is faithful without embedding fonts. -->
  <rect width="1200" height="630" fill="#14171C"/>
  <!-- subtle gold vignette top-right -->
  <defs>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.9">
      <stop offset="0" stop-color="#C49A3F" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#C49A3F" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#C49A3F" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- al-Nizam mark: crescent (paper) + gold dot -->
  <g transform="translate(96,120) scale(1.15)" aria-hidden="true">
    <path fill="#F6F3EC" d="m 66.225562,102.91471 a 33.489777,21.861039 35.771948 0 0 30.000862,26.2724 33.489777,21.861039 35.771948 0 0 28.199956,-16.23224 33.489777,21.861039 35.771948 0 0 -23.48847,-30.296333 39.626193,25.86669 35.771943 0 1 35.98779,39.271113 39.626193,25.86669 35.771943 0 1 -33.36723,19.20667 39.626193,25.86669 35.771943 0 1 -37.332908,-38.22161 z" transform="translate(-56,-66)"/>
    <ellipse fill="#C49A3F" cx="24.5" cy="22.3" rx="6.39" ry="6.07"/>
  </g>

  <!-- wordmark -->
  <text x="188" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="600" fill="#F6F3EC" letter-spacing="0.5">al-Nizam</text>

  <!-- headline -->
  <text x="96" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" fill="#F6F3EC">An operating layer between</text>
  <text x="96" y="446" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="600" fill="#F6F3EC">you and <tspan fill="#C49A3F">AI</tspan>.</text>

  <!-- subline -->
  <text x="98" y="516" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" fill="#8A93A3">Continuity, governance, and accountability — held structurally.</text>

  <!-- footer url -->
  <text x="96" y="588" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#C49A3F" letter-spacing="0.06em">al-nizam.ai</text>
</svg>
