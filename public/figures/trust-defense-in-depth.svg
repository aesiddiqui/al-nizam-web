<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Defense in depth — twelve structural boundaries around regulated content</title>
  <desc id="desc">A protected core of regulated content sits at the centre, wrapped in six concentric defensive rings that group the framework's twelve structural layers. From the inside out: tenant classification; visibility tiers; IP-separation; continuous audit by the security and audit substrates; recorded compliance obligations; and the outermost gold ring, the pre-publish gate, which refuses to let anything reach the public until it is clean. Nothing reaches the outside without crossing every ring.</desc>

  <style>
    :root{
      --bg:#14171C; --text:#F6F3EC; --muted:#8A93A3; --faint:#6B7280;
      --ring:#3A4150; --core:#20262E; --gold:#C49A3F; --goldtext:#E6C66E;
      --markc:#F6F3EC; --markd:#C49A3F;
    }
    @media (prefers-color-scheme:light){
      :root{ --bg:#F6F3EC; --text:#14171C; --muted:#6B7280; --faint:#9A9484;
             --ring:#D9D2C4; --core:#FBF3DE; --gold:#A6791C; --goldtext:#8A6414;
             --markc:#14171C; --markd:#C49A3F; }
    }
    :root.light{ --bg:#F6F3EC; --text:#14171C; --muted:#6B7280; --faint:#9A9484;
                 --ring:#D9D2C4; --core:#FBF3DE; --gold:#A6791C; --goldtext:#8A6414;
                 --markc:#14171C; --markd:#C49A3F; }
    .t{fill:var(--text)} .m{fill:var(--muted)} .f{fill:var(--faint)} .g{fill:var(--gold)} .gt{fill:var(--goldtext)}
    .ttl{font-family:Georgia,'Times New Roman',serif;fill:var(--text)}
    .lbl{font-family:ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif}
    .ringline{stroke:var(--ring);fill:none} .goldring{stroke:var(--gold);fill:none}
    .markc{fill:var(--markc)} .markd{fill:var(--markd)}
  </style>

  <rect width="1060" height="640" rx="12" fill="var(--bg)"/>

  <!-- al-Nizam mark (subject IS al-Nizam) -->
  <g transform="translate(1002,40) scale(0.60)" opacity="0.95" aria-hidden="true">
    <path class="markc" d="m 66.225562,102.91471 a 33.489777,21.861039 35.771948 0 0 30.000862,26.2724 33.489777,21.861039 35.771948 0 0 28.199956,-16.23224 33.489777,21.861039 35.771948 0 0 -23.48847,-30.296333 39.626193,25.86669 35.771943 0 1 35.98779,39.271113 39.626193,25.86669 35.771943 0 1 -33.36723,19.20667 39.626193,25.86669 35.771943 0 1 -37.332908,-38.22161 z" transform="translate(-56,-66)"/>
    <ellipse class="markd" cx="24.5" cy="22.3" rx="6.39" ry="6.07"/>
  </g>

  <!-- title band -->
  <text class="ttl" x="48" y="54" font-size="27" font-weight="600" letter-spacing="-.01em">Defense in depth, not a single gate</text>
  <text class="lbl m" x="48" y="82" font-size="14.5">The twelve structural layers, grouped into six rings around the regulated core.</text>

  <!-- ===== concentric rings (left), centre (300,368); outer ring clears the title band ===== -->
  <g>
    <circle class="ringline" cx="300" cy="368" r="48"  stroke-width="1.5"/>
    <circle class="ringline" cx="300" cy="368" r="88"  stroke-width="1.5"/>
    <circle class="ringline" cx="300" cy="368" r="128" stroke-width="1.5"/>
    <circle class="ringline" cx="300" cy="368" r="168" stroke-width="1.5"/>
    <circle class="ringline" cx="300" cy="368" r="208" stroke-width="1.5"/>
    <circle class="goldring" cx="300" cy="368" r="248" stroke-width="2.5"/>
    <!-- protected core -->
    <circle cx="300" cy="368" r="30" fill="var(--core)" stroke="var(--gold)" stroke-width="1.5"/>
    <text class="lbl gt" x="300" y="372" font-size="11" text-anchor="middle" font-weight="600">core</text>
  </g>

  <!-- ring numbers, seated just inside the top vertex of each ring (single digits) -->
  <g class="lbl f" font-size="12.5" text-anchor="middle">
    <text x="300" y="335">1</text>
    <text x="300" y="295">2</text>
    <text x="300" y="255">3</text>
    <text x="300" y="215">4</text>
    <text x="300" y="175">5</text>
    <text class="g" x="300" y="135" font-weight="700">6</text>
  </g>

  <!-- ===== key (right), rows keyed to ring numbers ===== -->
  <text class="lbl f" x="640" y="132" font-size="11.5" letter-spacing=".08em">INNERMOST &#8594; OUTERMOST</text>
  <g class="lbl">
    <text class="f" x="640" y="172" font-size="15" font-weight="700">1</text>
    <text class="t" x="666" y="172" font-size="14.5" font-weight="600">Tenant classification</text>
    <text class="m" x="666" y="191" font-size="12.5">every context declared Public / Personal / Sensitive / Regulated</text>

    <text class="f" x="640" y="228" font-size="15" font-weight="700">2</text>
    <text class="t" x="666" y="228" font-size="14.5" font-weight="600">Visibility tiers</text>
    <text class="m" x="666" y="247" font-size="12.5">four tiers; every transition is explicit, never silent</text>

    <text class="f" x="640" y="284" font-size="15" font-weight="700">3</text>
    <text class="t" x="666" y="284" font-size="14.5" font-weight="600">IP-separation guard</text>
    <text class="m" x="666" y="303" font-size="12.5">tenants cannot bleed into one another; audited every run</text>

    <text class="f" x="640" y="340" font-size="15" font-weight="700">4</text>
    <text class="t" x="666" y="340" font-size="14.5" font-weight="600">Continuous audit</text>
    <text class="m" x="666" y="359" font-size="12.5">one substrate enforces handling; another catches drift</text>

    <text class="f" x="640" y="396" font-size="15" font-weight="700">5</text>
    <text class="t" x="666" y="396" font-size="14.5" font-weight="600">Compliance obligations recorded</text>
    <text class="m" x="666" y="415" font-size="12.5">per-project threat model + standard (HIPAA / PCI / CMMC / …)</text>

    <text class="g" x="640" y="452" font-size="15" font-weight="700">6</text>
    <text class="t" x="666" y="452" font-size="14.5" font-weight="600">Pre-publish gate<tspan class="g">  — the outer boundary</tspan></text>
    <text class="m" x="666" y="471" font-size="12.5">scans for identifiers; refuses the visibility-flip until clean</text>
  </g>

  <text class="lbl gt" x="640" y="524" font-size="13" font-weight="600">Refusal by default.</text>
  <text class="lbl m" x="640" y="545" font-size="13">Nothing reaches the outside without crossing every ring.</text>
</svg>
