  <title id="ttl">The codified lesson, on disk — a representative memory entry</title>
  <desc id="desc">A console window showing the file audit-canon-before-adding.md being read. It has YAML frontmatter with name, description, and type feedback, then a short lesson: before creating a new term or entry, look for the existing file that already covers it; if found, apply it rather than adding a parallel one. The last line notes it is loaded at the start of every session hereafter. Representative content in real file format.</desc>
  <rect x="2" y="2" width="896" height="352" rx="10" fill="#14171C" stroke="rgba(255,255,255,0.10)"/>
  <path d="M2,12 a10,10 0 0 1 10,-10 h876 a10,10 0 0 1 10,10 v28 h-896 z" fill="#1C2027"/>
  <line x1="2" y1="40" x2="898" y2="40" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="24" cy="21" r="5" fill="rgba(255,255,255,0.16)"/>
  <circle cx="42" cy="21" r="5" fill="rgba(255,255,255,0.16)"/>
  <circle cx="60" cy="21" r="5" fill="rgba(255,255,255,0.16)"/>
  <text x="84" y="26" font-size="13" fill="#8A93A3">~/memory · audit-canon-before-adding.md</text>
  <g font-size="14">
    <text x="24" y="70"><tspan fill="#C49A3F">$</tspan><tspan fill="#D8DBE0"> cat memory/audit-canon-before-adding.md</tspan></text>
    <text x="24" y="96" fill="#6B7280">---</text>
    <text x="24" y="118"><tspan fill="#8A93A3">name:</tspan><tspan fill="#E6C66E"> audit-canon-before-adding</tspan></text>
    <text x="24" y="140"><tspan fill="#8A93A3">description:</tspan><tspan fill="#D8DBE0"> before inventing a new concept, check</tspan></text>
    <text x="24" y="162" fill="#D8DBE0">             whether the system already names it</text>
    <text x="24" y="184"><tspan fill="#8A93A3">type:</tspan><tspan fill="#D8DBE0"> feedback</tspan></text>
    <text x="24" y="206" fill="#6B7280">---</text>
    <text x="24" y="228" fill="#D8DBE0">Before creating a new term / entry / rule: look for</text>
    <text x="24" y="250" fill="#D8DBE0">the existing file that already covers it. If found,</text>
    <text x="24" y="272" fill="#D8DBE0">apply it — don't add a parallel one.</text>
    <text x="24" y="306"><tspan fill="#86BE93">✓</tspan><tspan fill="#8A93A3"> loaded at the start of every session hereafter</tspan></text>
  </g>
  <text x="24" y="338" font-size="11.5" fill="#6B7280">Representative — real file format, illustrative content (the actual internal entries stay private).</text>
