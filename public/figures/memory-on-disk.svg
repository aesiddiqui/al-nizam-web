    <ellipse fill="#C49A3F" cx="24.5" cy="22.3" rx="6.39" ry="6.07"/>
  </g>
  <text x="813" y="104" text-anchor="middle" font-size="11" fill="#8A93A3" letter-spacing=".02em">al-nizam.ai</text>
